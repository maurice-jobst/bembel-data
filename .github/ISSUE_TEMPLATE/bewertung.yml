name: "⭐ Bewertung abgeben"
description: "Bewerte ein Wasserhäuschen oder eine Ebbelwei-Wirtschaft (1–5 Sterne)."
title: "[Bewertung] "
labels: ["bewertung"]
body:
  - type: input
    id: eintrag
    attributes:
      label: Eintrag
      description: Name oder id des Eintrags (siehe data/)
      placeholder: "yok-yok"
    validations:
      required: true
  - type: dropdown
    id: sterne
    attributes:
      label: Sterne
      options: ["5", "4", "3", "2", "1"]
    validations:
      required: true
  - type: input
    id: kommentar
    attributes:
      label: Kommentar (optional)
      description: "Ein ehrlicher Satz, max. 280 Zeichen. Keine Beleidigungen, keine Werbung."
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Deine Bewertung wird als Datei `data/bewertungen/<eintrag>/<dein-login>.json`
        per PR aufgenommen — eine Bewertung pro Eintrag und GitHub-Account.
        Du kannst den PR auch direkt selbst stellen.
