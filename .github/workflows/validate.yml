name: Validate data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Schema validation (stdlib only, no pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: AGENTS.md line cap
        run: scripts/context-cap AGENTS.md 100
      - run: python3 scripts/validate.py
      - name: Trichter-Vertrag prüfen
        run: python3 scripts/check_funnel.py
